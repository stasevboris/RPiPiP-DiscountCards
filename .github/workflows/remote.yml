name: "Run App in Browser (Запустить симулятор)"

'on':
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Версия приложения: main (последняя), lab1, lab2, lab3 или lab4'
        required: true
        default: 'main'
      device_model:
        description: 'Устройство: iPhone 16 Pro или iPad Pro 13-inch (M4)'
        required: true
        default: 'iPhone 16 Pro'

jobs:
  build_for_browser:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Загрузка файлов
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Выбор Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Сборка приложения (около 1 минуты)
        run: |
          brew install xcodegen || true
          xcodegen generate
          xcodebuild build \
            -project DiscountCards.xcodeproj \
            -scheme DiscountCards \
            -destination "platform=iOS Simulator,name=${{ github.event.inputs.device_model }},OS=latest" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            VALIDATE_PRODUCT=NO

      - name: Подготовка архива для браузера
        run: |
          APP_PATH=$(find build/Build/Products -name "DiscountCards.app" | head -n 1)
          echo "Путь к собранному приложению: $APP_PATH"
          mkdir -p AppetizePayload
          cp -r "$APP_PATH" AppetizePayload/
          cd AppetizePayload
          zip -r ../DiscountCards-App.zip DiscountCards.app
          cd ..

      - name: Загрузка архива в артефакты GitHub
        uses: actions/upload-artifact@v4
        with:
          name: DiscountCards-Simulator-App
          path: DiscountCards-App.zip
          retention-days: 1

      - name: ИНСТРУКЦИЯ ПО ЗАПУСКУ В БРАУЗЕРЕ
        run: |
          echo "=========================================================="
          echo "## 📱 Приложение собрано и готово к запуску в браузере!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "К сожалению, серверы GitHub macos-14 больше не поддерживают трансляцию экрана (VNC), а старые серверы недоступны. Но есть гораздо лучший и быстрый способ (без лагов и ввода паролей)!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Как запустить приложение прямо сейчас (займет 1 минуту):" >> $GITHUB_STEP_SUMMARY
          echo "1. В самом низу этой страницы (в блоке **Artifacts**) скачайте файл **DiscountCards-Simulator-App** (он весит пару мегабайт)." >> $GITHUB_STEP_SUMMARY
          echo "2. Извлеките скачанный архив \`.zip\`. Внутри будет файл \`DiscountCards-App.zip\`." >> $GITHUB_STEP_SUMMARY
          echo "3. Перейдите на бесплатный сервис **[Appetize.io](https://appetize.io/upload)** (регистрация не нужна)." >> $GITHUB_STEP_SUMMARY
          echo "4. Нажмите **Select file** и загрузите туда файл \`DiscountCards-App.zip\`." >> $GITHUB_STEP_SUMMARY
          echo "5. Дождитесь загрузки (10 секунд) и нажмите **View App**." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 Готово! Приложение запустится в идеальном симуляторе iPhone прямо в вашем браузере." >> $GITHUB_STEP_SUMMARY
          echo "=========================================================="
