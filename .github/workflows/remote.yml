name: Запустить приложение в браузере

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Версия приложения: main (последняя), lab1, lab2, lab3 или lab4'
        required: true
        default: 'main'
      device_model:
        description: 'Устройство: iPhone 16 Pro или iPad Pro 13-inch (M4)'
        required: true
        default: 'iPhone 16 Pro'
      session_duration:
        description: 'Сколько минут будет работать (до 300)'
        required: true
        default: '60'

jobs:
  remote:
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Set up job
        run: echo "Инициализация окружения macOS для Стасева Б.В. (ИТП-41)..."

      - name: Загрузка файлов
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Выбор Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Сборка приложения (около 1 минуты)
        run: |
          brew install xcodegen || true
          xcodegen generate
          xcodebuild build \
            -project DiscountCards.xcodeproj \
            -scheme DiscountCards \
            -destination "platform=iOS Simulator,name=${{ github.event.inputs.device_model }},OS=latest" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            VALIDATE_PRODUCT=NO

      - name: Настройка VNC сервера
        run: |
          # 1. Задаем системный пароль пользователю runner
          sudo /usr/sbin/sysadminctl -resetPasswordFor runner -newPassword G6nTq8kl 2>/dev/null || true
          sudo dscl . -passwd /Users/runner "" G6nTq8kl 2>/dev/null || true
          
          # 2. Выдаем системные разрешения TCC (Screen Capture, Accessibility, PostEvent) для обхода диалогов macOS Sonoma
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.screensharingd',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1700000000);" 2>/dev/null || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','com.apple.screensharingd',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1700000000);" 2>/dev/null || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access VALUES('kTCCServicePostEvent','com.apple.screensharingd',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1700000000);" 2>/dev/null || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.RemoteDesktopAgent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1700000000);" 2>/dev/null || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','com.apple.RemoteDesktopAgent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1700000000);" 2>/dev/null || true
          
          # 3. Отключаем диалог подтверждения от локального пользователя (ScreenSharingReqPerm)
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement ScreenSharingReqPerm -bool false
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysAddLocalHash -bool true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement ARD_AllLocalUsers -bool true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement ARD_AllLocalUsersPrivs -int 1073742079
          sudo defaults write /Library/Preferences/com.apple.RemoteDesktop VNCOnly -bool true
          
          # 4. Активация через kickstart без подтверждений (-setreqperm no)
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -users runner -privs -all \
            -allowAccessFor -allUsers \
            -clientopts -setvnclegacy yes -setvncpw -vncpw G6nTq8kl -setreqperm no || true
            
          sudo chmod 644 /Library/Preferences/com.apple.VNCSettings.txt 2>/dev/null || true
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent -console || true

      - name: Установка инструментов трансляции (cloudflared и noVNC)
        run: |
          # Прямая загрузка официального бинарника cloudflared для Apple Silicon (macOS)
          sudo mkdir -p /usr/local/bin
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz -o /tmp/cloudflared.tgz
          sudo tar -xzf /tmp/cloudflared.tgz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/cloudflared
          sudo cp /usr/local/bin/cloudflared /opt/homebrew/bin/cloudflared 2>/dev/null || true
          cloudflared --version

          # Подготовка noVNC и websockify
          python3 -m pip install websockify 2>/dev/null || true
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc || true
          git clone --depth 1 https://github.com/novnc/websockify.git /tmp/novnc/utils/websockify || true
          chmod +x /tmp/novnc/utils/novnc_proxy

          # Настройка noVNC на автоматический ввод учетных данных без всплывающих окон
          python3 -c "
with open('/tmp/novnc/app/ui.js', 'r') as f:
    text = f.read()
text = text.replace('credentialsRequired(e) {', 'credentialsRequired(e) { UI.rfb.sendCredentials({ username: \'runner\', password: \'G6nTq8kl\' }); return;')
with open('/tmp/novnc/app/ui.js', 'w') as f:
    f.write(text)
" 2>/dev/null || true

      - name: Запуск симулятора iPhone (около 2-3 минут)
        run: |
          open -a Simulator || true
          xcrun simctl boot "${{ github.event.inputs.device_model }}" || true
          xcrun simctl bootstatus booted -b || true
          APP_PATH=$(find build/Build/Products -name "DiscountCards.app" | head -n 1)
          echo "Путь к собранному приложению: $APP_PATH"
          xcrun simctl install booted "$APP_PATH"
          xcrun simctl launch booted by.gstu.itp41.stasev.DiscountCards || true

      - name: ССЫЛКА НА ПРИЛОЖЕНИЕ (откройте этот шаг)
        run: |
          # Запуск моста noVNC к VNC (5900 -> 8080)
          /tmp/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 8080 > /tmp/novnc_proxy.log 2>&1 &
          
          # Запуск Cloudflare Quick Tunnel
          /usr/local/bin/cloudflared tunnel --url http://localhost:8080 > /tmp/cloudflared.log 2>&1 &
          
          TUNNEL_URL=""
          for i in {1..40}; do
            TUNNEL_URL=$(grep -o 'https://[^ ]*trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 1
          done
          
          echo "=========================================================="
          echo " ССЫЛКА ДЛЯ ВХОДА В СИМУЛЯТОР В БРАУЗЕРЕ:"
          if [ -n "$TUNNEL_URL" ]; then
            echo ""
            echo " 👉 $TUNNEL_URL/vnc.html?autoconnect=true&password=G6nTq8kl"
            echo ""
          else
            echo "Не удалось получить ссылку туннеля за 40 секунд. Лог:"
            cat /tmp/cloudflared.log
          fi
          echo " Пароль уже встроен в ссылку (автоматический вход)"
          echo "=========================================================="
          
          MINS=${{ github.event.inputs.session_duration }}
          echo "Сеанс запущен на $MINS минут (не закрывайте шаг, пока пользуетесь)..."
          sleep $(($MINS * 60))
