name: DiscountCards
options:
  bundleIdPrefix: by.gstu.itp41.stasev
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  DiscountCards:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.gstu.itp41.stasev.DiscountCards
        INFOPLIST_KEY_CFBundleDisplayName: "Дисконтные карты"
        INFOPLIST_KEY_NSCameraUsageDescription: "Требуется доступ к камере для сканирования штрихкодов дисконтных карт"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_TESTABILITY: YES
  DiscountCardsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/UnitTests
    dependencies:
      - target: DiscountCards
  DiscountCardsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/UITests
    dependencies:
      - target: DiscountCards
schemes:
  DiscountCards:
    build:
      targets:
        DiscountCards: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: DiscountCardsTests
  DiscountCardsTests:
    build:
      targets:
        DiscountCardsTests: all
    test:
      config: Debug
      targets:
        - name: DiscountCardsTests
  DiscountCardsUITests:
    build:
      targets:
        DiscountCardsUITests: all
    test:
      config: Debug
      targets:
        - name: DiscountCardsUITests
